services:
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-123456}
    volumes:
      - ./mongo-keyfile:/tmp/mongo-keyfile:ro
      - mongo-data:/data/db
    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /tmp/mongo-keyfile /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost:27017
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:8.2
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-123456}
    entrypoint:
      - /bin/bash
      - -c
      - |
        mongosh --quiet --host mongodb:27017 \
          --username "$${MONGO_INITDB_ROOT_USERNAME}" \
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" \
          --authenticationDatabase admin \
          --eval 'try { rs.status() } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}) }'
        until mongosh --quiet --host mongodb:27017 \
          --username "$${MONGO_INITDB_ROOT_USERNAME}" \
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" \
          --authenticationDatabase admin \
          --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do
          sleep 2
        done

