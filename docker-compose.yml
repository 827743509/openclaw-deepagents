  postgres:
    # 自定义镜像：在 pgvector/pgvector:pg16 之上叠加 zhparser，
    # 一次构建同时支持 pgvector（第 3 章）+ 中文全文检索（第 6 章）。
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: rag-kb-postgres:pg16
    container_name: rag-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag_kb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_kb}"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped

    ports:
      # S3 API
      - "9000:9000"
      # MinIO Web 管理后台
      - "9001:9001"

    environment:
      # 管理员账号
      MINIO_ROOT_USER: minioadmin

      # 管理员密码，至少 8 位
      MINIO_ROOT_PASSWORD: minioadmin123

    volumes:
      # 数据持久化
      - minio-data:/data

    command: server /data --console-address ":9001"

volumes:
  mongo-data:
  redis-data:
  pg-data:
  minio-data:
