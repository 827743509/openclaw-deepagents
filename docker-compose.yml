services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-123456}
    volumes:
      - ./mongo-keyfile:/tmp/mongo-keyfile:ro
      - mongo-data:/data/db
    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /tmp/mongo-keyfile /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost:27017
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-123456}
    entrypoint:
      - /bin/bash
      - -c
      - |
        mongosh --quiet --host mongodb:27017 \
          --username "$${MONGO_INITDB_ROOT_USERNAME}" \
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" \
          --authenticationDatabase admin \
          --eval 'try { rs.status() } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}) }'
        until mongosh --quiet --host mongodb:27017 \
          --username "$${MONGO_INITDB_ROOT_USERNAME}" \
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" \
          --authenticationDatabase admin \
          --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do
          sleep 2
        done

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SSW_WEB_HOST: 0.0.0.0
      SSW_WEB_PORT: 8000
      SSW_AGENT_PROTOCOL_HOST: 0.0.0.0
      SSW_AGENT_PROTOCOL_PORT: 2024
      SSW_AGENT_PROTOCOL_URL: http://127.0.0.1:2024
      REDIS_URL: redis://redis:6379/0
      LS_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-123456}@mongodb:27017/langgraph?authSource=admin&replicaSet=rs0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${AGENT_PROTOCOL_PORT:-2024}:2024"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)
      interval: 10s
      timeout: 6s
      start_period: 90s
      retries: 12

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_SSW_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9001}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
