[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssw-agent"
version = "0.1.0"
description = "OpenClaw-like personal AI assistant MVP built with LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "deepagents>=0.5.2",
  "langchain>=1.0.0",
  "langgraph>=1.0.0",
  "langchain-openai>=1.0.0",
  "langchain-anthropic>=1.0.0",
  "langchain-google-genai>=3.0.0",
  "langchain-mcp-adapters>=0.2.2",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "uvicorn>=0.30.0",
  "tavily-python>=0.5.0",
  "langgraph-cli[inmem]>=0.4.25",
  "langgraph-checkpoint-redis>=0.4.1",
  "claude-agent-sdk>=0.2.87",
  "fastapi>=0.136.3",
  "pymysql>=1.1.1",
  "clickhouse-connect>=0.10.0",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "llama-index-core>=0.14.23",
  "redis>=7.4.0",
  "langgraph-checkpoint-mongodb>=0.4.0",
  "apscheduler>=3.11.3",
]

[tool.setuptools.packages.find]
where = ["src"]
